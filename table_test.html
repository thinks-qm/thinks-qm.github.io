<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Table</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        /* Hide the ID column */
        .id-column {
            display: none;
        }
    </style>
</head>

<body>

    <h1>Assessments</h1>

    <table id="assessmentTable">
        <thead>
            <tr>
                <th class="id-column">ID</th>
                <th>Assessment number</th>
                <th>Type</th>
                <th>Length</th>
                <th>Weighting</th>
                <th>Due date</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td class="id-column">TH-Sand</td>
                <td>A1</td>
                <td>presentation</td>
                <td>100</td>
                <td>50</td>
                <td>18/08/2026</td>
            </tr>

            <tr>
                <td class="id-column">TH-Sand</td>
                <td>A2</td>
                <td>essay</td>
                <td>200</td>
                <td>50</td>
                <td>19/08/2026</td>
            </tr>

            <tr>
                <td class="id-column">BB-Sand</td>
                <td>A1</td>
                <td>presentation</td>
                <td>300</td>
                <td>70</td>
                <td>20/08/2026</td>
            </tr>

            <tr>
                <td class="id-column">BB-Sand</td>
                <td>A2</td>
                <td>essay</td>
                <td>400</td>
                <td>30</td>
                <td>21/08/2026</td>
            </tr>

            <tr>
                <td class="id-column">CA-Sand</td>
                <td>A1</td>
                <td>presentation</td>
                <td>500</td>
                <td>20</td>
                <td>22/08/2026</td>
            </tr>

            <tr>
                <td class="id-column">CA-Sand</td>
                <td>A2</td>
                <td>essay</td>
                <td>600</td>
                <td>80</td>
                <td>23/08/2026</td>
            </tr>
        </tbody>
    </table>

    <script>
        // Read the "id" value from the URL.
        // Example:
        // page.html?id=TH-Sand
        const params = new URLSearchParams(window.location.search);
        const selectedId = params.get("id");

        // Get all rows in the table body.
        const rows = document.querySelectorAll("#assessmentTable tbody tr");

        rows.forEach(row => {
            // The hidden first cell contains the ID.
            const rowId = row.cells[0].textContent.trim();

            // If an ID was supplied, only show matching rows.
            if (selectedId && rowId !== selectedId) {
                row.style.display = "none";
            } else {
                row.style.display = "";
            }
        });
    </script>

</body>
</html>
